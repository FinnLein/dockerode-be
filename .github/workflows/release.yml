name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  releasing:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup  

      - name: Get next version
        id: get_version
        run: |
          NEXT_VERSION=$(pnpm dlx semantic-release --dry-run 2>&1 | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")

          if [ -z "$NEXT_VERSION" ]; then 
            echo "Нет коммитов для релиза"
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "Следующая версия: v$NEXT_VERSION"
            echo "version=v$NEXT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Creating Tag
        if: steps.get_version.outputs.version != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}
       

      - name: Login to GHCR
        if: steps.get_version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.get_version.outputs.version != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.get_version.outputs.version }}

      - name: Build and push
        if: steps.get_version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: . 
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

