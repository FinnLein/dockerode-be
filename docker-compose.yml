name: dockerode-be 
services:
  rabbit:
    container_name: rabbit-dockerode
    image: rabbitmq:4-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASS}

  postgres:
    container_name: postgres-dockerode
    image: postgres:18.6-alpine
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    container_name: redis-dockerode
    image: redis:8.8.4-alpine3.23
    ports:
      - '6379:6379'
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  rustfs-perms:
    container_name: rustfs-perms
    image: alpine:3.24.4
    user: root
    volumes:
      - rustfs_data:/data/rustfs0
    command: ["sh", "-c", "chown -R 10001:10001 /data/rustfs0"]

  rustfs:
    container_name: rustfs-dockerode
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin123}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - rustfs_data:/data/rustfs0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  rustfs_data: